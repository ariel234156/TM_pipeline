# Copy this file (e.g. `cp pipeline_config.example.yaml pipeline_config.yaml`)
# and edit paths/parameters for your dataset. Every value here is a CLI flag
# passed straight through to AreTomo3 or isonet.py -- run_pipeline.py does
# not hardcode any of it. Run `python3 run_pipeline.py --config
# pipeline_config.yaml --dry-run` first to print every command without
# executing anything, and check it against `AreTomo3 --help` / `isonet.py
# <subcommand> --help` on your install before a real run.

# engine picks which alignment engine you're using -- see the "aretomo2:"
# and "imod:" sections further down for when to use those.
#   "aretomo3" (default): AreTomo3, from raw frames + .mdoc files -- the
#      "aretomo:" section below. Produces EVN/ODD half-tomograms ->
#      organize -> isonet2-n2n (noise2noise) training.
#   "aretomo2": AreTomo2, from a directory of already-assembled tilt
#      series .mrc stacks (e.g. motion-corrected elsewhere) -- the
#      "aretomo2:" section. One AreTomo2 call per .mrc file, no even/odd
#      split -> isonet2's single-tomogram method instead (enable
#      isonet.deconv in that case).
#   "imod_raptor": IMOD + RAPTOR fiducial-based alignment -- the "imod:"
#      section. A THIRD, independent engine, NOT chained through AreTomo.
#      Needs real gold fiducial markers in the sample. Supports either raw
#      EER frames + .mdoc (motion-corrected by IMOD's own alignframes) or
#      pre-assembled .st/.mrc stacks, via imod.input_mode. Like aretomo2,
#      no even/odd split -> isonet2's single-tomogram method.
# engine: aretomo3

aretomo_bin: AreTomo3      # path to the AreTomo3 binary, if not on PATH
aretomo2_bin: AreTomo2     # path to the AreTomo2 binary, if not on PATH (only used when engine: aretomo2)

# skip_denoise: true skips IsoNet2 (prepare_star, deconv, make_mask, refine,
# predict) and runs template matching straight on organize's tomograms
# (aretomo3: organize then also writes the full volumes to
# <organize.out_dir>/FULL). Same as --skip-denoise on the command line.
# Give pytom.out_dir its own folder for such runs, or they overwrite the
# template matching results of denoised runs.
skip_denoise: false
# isonet.py -- a bare command name like this depends on PATH at run time,
# which depends on the right environment (conda/venv/etc.) being activated
# in whatever shell launches run_pipeline.py. If more than one isonet.py
# install exists on the machine (e.g. an old/beta copy left on PATH by a
# stale dotfile entry), forgetting to activate can silently run the WRONG
# one and fail with a confusing ModuleNotFoundError for a dependency that
# "should" be installed. To make this immune to activation/PATH mistakes
# entirely, set isonet_bin to a [python_path, script_path] pair instead --
# isonet2_steps.py accepts either form -- e.g.:
#   isonet_bin: ["/path/to/your/env/bin/python", "/path/to/isonet.py"]
isonet_bin: isonet.py

# ---------------------------------------------------------------------------
# Stage 1: AreTomo3 -- motion correction, CTF, alignment, WBP reconstruction.
# Keys map to AreTomo3 flags via aretomo_step.FLAG_MAP. Values mirror
# command.sh in this folder (the current AreTomo3 command for this dataset).
# ---------------------------------------------------------------------------
aretomo:
  in_prefix: /mnt/cryonas02/Users/Gabriel_Frank/Ariel_Cohen/test_ferr/frames/
  in_suffix: .mdoc
  in_skips: override
  out_dir: /mnt/cryonas02/Users/Gabriel_Frank/Ariel_Cohen/test_ferr/aretomo3_out_bin8
  tmp_dir: /mnt/cryonas02/Users/Gabriel_Frank/Ariel_Cohen/test_ferr/aretomo3_out_bin8
  log_dir: /mnt/cryonas02/Users/Gabriel_Frank/Ariel_Cohen/test_ferr/aretomo3_out_bin8
  gain: /mnt/cryonas02/Users/Gabriel_Frank/Ariel_Cohen/test_ferr/20240826_170013_EER_GainReference.gain
  # Camera defects masked before motion correction -- must match the gain
  # reference above; regenerate for any other one:
  #   python3 find_gain_defects.py <gain> <out.txt>
  # (this gain marks a dead column, x = 1048, with values up to ~3800 that
  # AreTomo3 multiplies in as a bright line in every tilt -- see README)
  defect_file: /mnt/cryonas02/Users/Gabriel_Frank/Ariel_Cohen/test_ferr/camera_defects_20240826.txt
  pix_size: 1.51
  kv: 200
  cs: 2.70
  amp_contrast: 0.07      # AreTomo3 default: 0.07
  # Motion correction: see aretomo_step.py -- flags/defaults checked against
  # AreTomo3 2.3.1's own source (its --help text is not reliable).
  fm_dose: 0               # 0 = use each tilt's ExposureDose from the .mdoc (recommended). For EER, AreTomo3 sets tilt dose = FmDose x number of RAW EER frames, so only enter the dose per raw frame here, never per tilt
  fm_int: 10               # raw EER frames per rendered fraction (AreTomo3 default, ~0.15 e/A2 per fraction at typical tomography dose). 0 = let AreTomo3 choose ~0.15 e/A2 per fraction from the dose
  eer_sampling: 1          # 2 (+ mc_bin 2) renders 2x super-resolution and Fourier-bins back to the same pixel -- ~4x compute, gain only near Nyquist; not worth it for binned tomograms
  mc_bin: 1                # pair with eer_sampling (2 only if eer_sampling is 2)
  group: [1, 4]            # frames summed before measuring motion: 1st = whole-frame alignment, 2nd = patch alignment (unused while mc_patch is [1, 1])
  mc_patch: [1, 1]         # whole-frame alignment only -- a tilt image (~1-3 e/A2) is too little signal for local patches; nextPYP and AreTomo3's own default do the same
  # mc_iter: 15            # AreTomo3 2.3.1 source defaults (its --help text says 7 / 0.5 -- outdated)
  # mc_tol: 0.1
  # rot_gain: 0            # gain orientation: rotate 0/1/2/3 = 0/90/180/270 deg counter-clockwise
  # flip_gain: 0           # 0 none, 1 upside down, 2 left-right (after rotation)
  # at_patch: [4, 4]       # local tilt-series alignment patches (x y); no gain in even/odd FSC at bin 8 on this dataset, 2.7x slower
  # Tilt axis in AreTomo3's OWN frame -- NOT the .mdoc TiltAxisAngle, which
  # is in SerialEM's image frame (~90 deg off for raw EER frames here; see
  # README "AreTomo3 tilt axis and camera defects"). [0, 1] = full search
  # per series (+ 180 deg handedness check from CTF). Once measured (ROT
  # column of the .aln), lock it for the batch: [<angle>, -1]. This
  # dataset: [179.2, -1].
  tilt_axis: [0, 1]
  tilt_cor: 1
  align_z: 0              # Z height used during alignment; 0 = the thickness AreTomo3 measures per series (recommended -- one fixed value is unsuitable for a batch)
  vol_z: 2096             # reconstructed Z height. -1 = measured thickness + ext_z (300)
  at_bin: [8, 8]          # first value is the "primary" bin used below
  wbp: 1
  corr_ctf: 1
  out_imod: 3
  split_sum: 1
  resume: 1
  gpu: [0, 1, 2, 3]
  # extra:                # pass-through for any AreTomo3 flag not listed
  #   "-OutXF": 1          # above, using the flag's exact spelling

# ---------------------------------------------------------------------------
# Stage 1 ALTERNATIVE: AreTomo2 (aretomo2_step.py) -- only used when
# engine: aretomo2 above. For tilt series you already have as a single
# assembled MRC stack per position (e.g. motion-corrected by a separate
# tool), not raw frames + mdoc. One AreTomo2 call runs per *.mrc file
# found in in_dir. Keys map to AreTomo2 flags via aretomo2_step.FLAG_MAP.
#
# AreTomo2 writes no CTF.txt-equivalent output (confirmed against a real
# run) -- prepare_star gets no automatic per-tomogram defocus in this
# path, so isonet.prepare_star.defocus is left for isonet.py's own
# default unless you set it explicitly.
# ---------------------------------------------------------------------------
# aretomo2:
#   in_dir: /path/to/already_assembled_tilt_series/
#   out_dir: /path/to/aretomo2_out
#   out_suffix: _AreTomo    # output filenames: <input_stem><out_suffix>.mrc
#   skip_existing: true     # skip a file if its output already exists (AreTomo2 has no built-in -Resume)
#   pix_size: 1.51
#   kv: 300
#   cs: 2.70
#   amp_contrast: 0.07
#   tilt_range: [-60, 60]   # omit to use the MRC header's own tilt range
#   tilt_axis: [0, -1]      # [angle, -1] = use as-is; [angle, 1] = refine within +/-3 degrees (see AreTomo3 manual's -TiltAxis section, same semantics)
#   align_z: 600
#   vol_z: 1200
#   out_bin: 4
#   wbp: 1
#   patch: [4, 4]           # AreTomo2's single local-alignment patch flag (no separate motion-correction stage to apply McPatch to)
#   gpu: [0]
#   # extra:                # pass-through for any AreTomo2 flag not listed above
#   #   "-CropVol": 4096 4096

# ---------------------------------------------------------------------------
# Stage 1 ALTERNATIVE: IMOD + RAPTOR fiducial-based alignment (imod_step.py)
# -- only used when engine: imod_raptor above. A THIRD, independent engine,
# NOT chained through AreTomo at all -- for raw EER input (input_mode: eer)
# motion correction is done by IMOD's OWN alignframes tool, not AreTomo.
# Needs REAL gold fiducial markers in the sample (RAPTOR can't align
# without them).
#
# CHECK YOUR IMOD VERSION AND IMOD_DIR before trusting a RAPTOR crash to
# be a bug in this pipeline. Two real, separate issues were found and
# fixed on real gold-fiducial data:
#   1. IMOD 5.1.0 (RHEL8 build, Dec 2024) has a real tiltalign crash --
#      reproducible across bash, Python subprocess (argv-list and
#      shell=True), every -mode/-input flag spelling tried. tiltalign
#      dies partway through writing the .xf transform file, right after
#      printing the full per-point residual-error table, leaving .xf
#      empty or truncated -- and RAPTOR's own exit code still reports 0.
#      Installing IMOD 5.1.13 (13 point-releases newer) into a
#      user-writable directory (no sudo/system changes needed if
#      /usr/local isn't writable) fixed this, but ALSO needed setting
#      the IMOD_DIR environment variable to the new install (not just
#      PATH/LD_LIBRARY_PATH) -- the RAPTOR wrapper script runs
#      "$IMOD_DIR/bin/realbin/RAPTOR" literally, so if your machine has
#      IMOD_DIR already set globally (check /etc/profile.d), it'll
#      silently keep running the OLD install's binary no matter what
#      bin_dir says here, unless something overrides IMOD_DIR too (which
#      imod_step.py's _env() now does).
#   2. Separately (not a crash): bare RAPTOR never writes align/*.ali
#      itself, with or without -rec -- it reaches "Generating aligned
#      stack" in its own log and then fails calling tiltalign again for
#      that one step. imod_step.py builds .ali itself via a plain
#      newstack -xform whenever this happens.
# This pipeline deliberately does not add automatic retry (keep it
# simple, fail loudly) -- if a tilt series comes out with an empty or
# missing .xf, just re-run run_pipeline.py --start-from imod_align for
# that one tilt series.
# ---------------------------------------------------------------------------
# imod:
#   bin_dir: /usr/local/imod_5.1.0/bin  # if you hit the crash above, try a newer IMOD install instead (see IMOD_DIR note above)
#   input_mode: eer         # eer (raw frames + .mdoc, via alignframes) | mrc (pre-assembled .st/.mrc)
#   in_dir: /path/to/eer_frames_or_mrc_stacks/
#   in_suffix: .mdoc        # input_mode: eer only
#   gain: /path/to/gain_reference.gain   # input_mode: eer only
#   out_dir: /path/to/imod_raptor_out
#   voltage: 300             # must be 200 or 300 (alignframes requirement)
#   pixel_size_angstrom: 1.51
#   bin_factor: 8            # pre-binning before RAPTOR (RAPTOR itself gets -bin 1 -- see imod_step.py)
#   thickness_px: 512
#   gold_diameter_nm: 10
#   out_suffix: _final      # final tomogram filename: <base><out_suffix>.mrc (what organize/relion5_star look for)
#   feed_variant: wbp        # which reconstruction type becomes <base>_final.mrc: wbp | fake_sirt | filtered
#   xray_removal:
#     enabled: true          # ccderaser -find before binning (hot pixels / X-ray strikes)
#   erase_gold:
#     # When enabled, EVERY tilt series gets reconstructed BOTH ways: with
#     # gold (<base>_bin8.mrc, from the raw RAPTOR-aligned stack) and
#     # without gold (<base>_bin8_noGold.mrc, from the gold-erased stack) --
#     # both sets of files (plus FakeSIRT/filtered variants if configured)
#     # always exist on disk. The <base>_final.mrc symlink (what organize/
#     # relion5_star/downstream IsoNet2 use) is built from the NO-GOLD
#     # reconstruction specifically -- downstream processing continues on
#     # the gold-erased tomogram.
#     # How: the beads RAPTOR tracked + every bead imodfindbeads finds are
#     # erased on the RAW binned stack (where those coordinates are valid),
#     # then that stack is aligned with the same .xf as the with-gold one
#     # (see imod_step.erase_gold's docstring). To regenerate existing
#     # no-gold stacks, move <base>_bin8_noGold.ali aside and re-run
#     # imod_align -- it erases from the files on disk without re-running
#     # RAPTOR, then re-run imod_reconstruct.
#     enabled: false
#     find_untracked: true   # also erase beads RAPTOR didn't track (imodfindbeads); false = RAPTOR's beads only
#     better_radius_px: null # erase radius (px); null = round(0.75 * gold diameter px) -- covers core + Fresnel fringe
#   raptor:
#     markers_per_image: null  # null = let RAPTOR auto-estimate (recommended to start)
#     xray: false            # RAPTOR's own -xray: strip strong line features before marker detection
#   reconstruction:
#     fake_sirt_iterations: 10  # omit/0 to skip this extra reconstruction variant entirely
#   filtered_reconstruction:
#     enabled: false          # mtffilter low/high-pass contrast filter + a second reconstruction
#     low_pass: [0.2, 0.05]   # [radius, sigma], fraction of Nyquist
#     high_pass: 0.0
#   # align_frames:           # pass-through for any extra alignframes flag (input_mode: eer only)
#   #   dtype: 4              # e.g. dose-weighting from the .mdoc (-dtype 4 -dfile <mdoc>)

# ---------------------------------------------------------------------------
# Stage 1b (optional): generate a RELION5-compatible tomograms.star (+ one
# tilt_series/<name>.star per tomogram), via relion5_star.py. Works for
# EVERY engine -- which function/columns get used depends on engine above:
#   aretomo3: built from AreTomo3's own .mdoc/_CTF.txt/_TLT.txt output (real
#      per-image measured defocus). mdoc_dir defaults to aretomo.in_prefix.
#   2: built from each tomogram's companion .mdoc file alone -- AreTomo2
#      does no CTF estimation of its own, so this uses the .mdoc's own
#      per-image "Defocus" field (SerialEM's on-the-fly estimate, less
#      refined than AreTomo3's real CTF fit) for both rlnDefocusV/
#      rlnDefocusU, and defocus_handedness below for rlnTomoHand (no
#      per-dataset measurement available for this path). Requires a
#      companion <base>.mdoc next to each AreTomo2 input .mrc -- if your
#      pre-assembled stacks don't have one, this path has nothing to build
#      from and skips that tomogram. mdoc_dir defaults to aretomo2.in_dir.
# Schema verified two ways: against PyTom's own RELION5 reader
# (pytom_tm.io.parse_relion5_star_data), and (engine: aretomo3 path only)
# against a REAL relion_tomo_import SerialEM run -- row order, pre-
# exposure convention, and column set all matched exactly. The
# aretomo2/imod_raptor paths have NOT been cross-checked against a real RELION5
# import.
#
# GOTCHA (engine: aretomo3, confirmed empirically): AreTomo3's
# _TLT.txt/_CTF.txt are sorted by TILT ANGLE, not acquisition order --
# dose-symmetric schemes acquire non-monotonically (e.g. 0, 2, -2, -4, 4,
# ...). Dose accumulation (rlnMicrographPreExposure) is computed from the
# .mdoc file's own [ZValue] sections instead, which ARE in true
# acquisition order and each carry their own ExposureDose.
# ---------------------------------------------------------------------------
# relion5_star:
#   out_dir: /path/to/relion5_star_output
#   # mdoc_dir:               # defaults to aretomo.in_prefix (aretomo3) or aretomo2.in_dir/imod.in_dir (aretomo2/imod_raptor)
#   # optics_group_name: opticsGroup1
#   defocus_handedness: 1    # aretomo2/imod_raptor only -- no per-dataset measurement available; RELION5 itself defaults this to 1 when unknown

# ---------------------------------------------------------------------------
# Stage 2: organize. With engine: aretomo3 (default), symlinks AreTomo3's
# EVN/ODD volumes into the layout isonet2's prepare_star expects (calls
# organize_for_isonet2.py's own functions). With engine: aretomo2 or
# imod_raptor, symlinks just the real tomogram volumes from
# aretomo2.out_dir/imod.out_dir into out_dir below, filtering out each
# engine's own auxiliary files via its out_suffix (see
# organize_aretomo2_output() in run_pipeline.py) -- the rest of this
# section (raw_pixel_size/bin_factor/defocus_source/copy) is ignored in
# that case; pixel_size is instead computed from aretomo2.pix_size *
# aretomo2.out_bin or imod.pixel_size_angstrom * imod.bin_factor.
# ---------------------------------------------------------------------------
organize:
  out_dir: /mnt/cryonas02/Users/Gabriel_Frank/Ariel_Cohen/test_ferr/isonet2_input
  # pixel_size: 12.08                 # set directly, OR derive from:
  raw_pixel_size: 1.51                # aretomo.pix_size
  bin_factor: 8                       # aretomo.at_bin[0] (the primary bin)
  defocus_source: ctf                 # ctf | none -- see organize_for_isonet2.py
  copy: false                         # false = symlink (needs local/POSIX fs)

# ---------------------------------------------------------------------------
# Stage 3+: isonet2. Every key under each subcommand is forwarded verbatim
# as `--key value` (see isonet2_steps.py) -- add/remove any documented
# IsoNet2 parameter here without touching code. Tables:
# https://github.com/IsoNet-cryoET/IsoNet2
#
# GOTCHA: each stage's output_dir below is a RELATIVE path by default, and
# isonet.py always resolves relative paths against whatever directory you
# happen to launch run_pipeline.py FROM -- not against organize.out_dir or
# any other path in this file. Launch from a different directory next time
# (a different terminal session, a different cwd) and your output silently
# lands somewhere else, not where your dataset lives. Use absolute paths
# here instead (e.g. pointing into the same folder as organize.out_dir) to
# make output location independent of where you happen to run the command.
# ---------------------------------------------------------------------------
isonet:
  prepare_star:
    star_name: tomograms.star
    voltage: 300
    ac: 0.1
    # tilt_min/tilt_max: with engine: aretomo3 these are only a fallback.
    # Each tomogram's star row gets the range AreTomo3 actually
    # reconstructed with (the .aln TILT column, which includes the tilt
    # offset AreTomo3 measured -- up to +-25 deg on the 2026-09-08 data);
    # see run_pipeline.py's apply_aln_tilt_ranges. A shared -60/+60 put
    # IsoNet2's missing wedge in the wrong place.
    tilt_min: -60
    tilt_max: 60
    # number_subtomos: 3000          # default: auto (3000 total / n tomograms)
    # cs, defocus, pixel_size, even, odd are wired in automatically from the
    # aretomo/organize stages above -- do not set them here.

  deconv:
    # With engine: aretomo3 (default), organize/prepare_star only ever
    # produce EVN/ODD half-tomograms (no full tomogram), so rlnTomoName
    # stays None and deconv's default --input_column rlnTomoName would
    # crash trying to open "None". It also wouldn't help even if
    # repointed at the halves: refine's isonet2-n2n training path reads
    # rlnTomoReconstructedTomogramHalf1/2 directly and ignores
    # rlnDeconvTomoName entirely (see IsoNet/models/data_sequence.py
    # _load_statistics_and_mask). Leave disabled in that case.
    #
    # With engine: aretomo2 or imod_raptor (full tomograms, no even/odd
    # split -- see the aretomo2:/imod: sections), rlnTomoName IS populated,
    # deconv works normally, and it's the recommended way to get CTF
    # deconvolution for isonet2's single-tomogram method (set
    # isonet.refine.method: isonet2 too in that case) -- set enabled: true.
    enabled: false
    deconvstrength: 1.0
    snrfalloff: 1.0
    highpassnyquist: 0.02
    phaseflipped: false
    ncpus: 4
    output_dir: deconv

  make_mask:
    # The mask only decides where refine centres its training cubes;
    # predict corrects the whole tomogram whatever the mask. make_mask masks
    # only the tomograms refine trains on (train_tomos / top_ctf_n below).
    # mode (run_pipeline.py-only key, not an isonet.py flag):
    #   particles  - IsoNet2's default (density 50, std 50, patch 4):
    #                dense, textured spots; leaves gaps inside large
    #                aggregates
    #   aggregates - density 70, std 70, patch 8: each aggregate/bundle
    #                region as one smooth area, empty ice still out
    #   none       - no mask: training cubes anywhere in the tomogram,
    #                empty ice included
    # density_percentage / std_percentage / patch_size set here override
    # the mode's values. 100/100 drops both filters but keeps z_crop.
    mode: particles
    z_crop: 0.2
    output_dir: mask

  refine:
    # top_ctf_n (optional, run_pipeline.py-only key -- not an isonet.py flag):
    # cap training to just N tomograms, to cut refine's runtime. Selection
    # depends on engine:
    #   aretomo3: the N tilt series with the highest CTF cross-correlation
    #      score (column 6 of AreTomo3's *_CTF.txt, at the near-zero-tilt
    #      image -- see organize_for_isonet2.py's parse_ctf_score_near_zero).
    #      Scores are written to <organize.out_dir>/ctf_scores.csv by the
    #      organize stage, so organize must have run at least once first.
    #   aretomo2 / imod_raptor: neither does AreTomo3-style CTF estimation
    #      of its own -- no ctf_scores.csv to rank by -- so run_pipeline.py
    #      just takes the first N tomograms in star-file order instead
    #      (see select_first_n_indices()), not a quality-ranked selection.
    # Either way, isonet.py's refine has no --tomo_idx of its own (unlike
    # deconv/make_mask/predict), so run_pipeline.py writes a filtered copy
    # of the star file (<star_name>_top_ctf.star, same directory)
    # containing only the selected rows, and points refine at that instead.
    # Leave unset/0 to train on every tomogram in the star file.
    # top_ctf_n: 10
    #
    # train_tomos (optional, run_pipeline.py-only key): train on these
    # tomograms instead -- e.g. ones that show the structures the model has
    # to learn. Names as in the tomogram files, without .mrc and the
    # _EVN/_final suffix (Position_1_EVN.mrc -> Position_1). Wins over
    # top_ctf_n. After changing it, re-run from make_mask so the new
    # tomograms get masks: --start-from make_mask
    # train_tomos: [Position_1, Position_4]
    #
    # GOTCHA: IsoNet2's own training loop is `for step in range(save_interval,
    # epochs+1, save_interval)`. If epochs < save_interval that range is
    # EMPTY, so it silently trains zero epochs, exits 0, and writes no
    # checkpoint -- no error, no warning. Keep epochs >= save_interval
    # (ideally a multiple of it) or you'll get a clean "success" that did
    # nothing.
    method: isonet2-n2n    # we have even/odd volumes -> noise2noise training
    arch: unet-medium      # unet-small | unet-medium | unet-large | scunet-fast
    cube_size: 96           # multiple of 16, >= 64
    epochs: 50
    learning_rate: 3e-4
    loss_func: L2
    CTF_mode: null          # None | phase_only | wiener | network
    bfactor: 0               # 200-300 for isolated particles, 0 for cellular
    mw_weight: -1             # -1 disables; try 20-200 to weight missing wedge
    noise_level: 0
    mixed_precision: true
    gpuID: "0,1,2,3"
    ncpus: 16
    save_interval: 10
    output_dir: isonet_maps
    # pretrained_model: /path/to/model.pt   # to continue training

  predict:
    # model: /path/to/isonet_maps/model.pt  # optional -- if omitted,
    # run_pipeline.py picks the newest *.pt file in refine's output_dir
    apply_mw_x1: true
    isCTFflipped: false
    padding_factor: 1.5
    gpuID: "0,1,2,3"
    output_dir: corrected_tomos

# ---------------------------------------------------------------------------
# Stage 8 (optional): template matching via PyTom's pytom-match-pick
# toolkit (pytom_step.py, conda env pytom_tm -- scripts have an absolute
# shebang pointing at that env's own python, so invoking them by full path
# is immune to PATH/activation state, unlike isonet.py). Stages:
# tm_template -> tm_mask -> tm_match (per tomogram) -> tm_extract (per
# tomogram) -> tm_merge. Runs against the IsoNet2-denoised tomograms from
# the predict stage above (tomogram_dir defaults to isonet.predict.
# output_dir if not set here).
#
# GOTCHA (confirmed with a real run): IsoNet2's predict step does not
# always write the tomogram's real pixel size into its output MRC header
# -- check the REAL header with mrcfile before trusting it either way,
# don't assume. voxel_size_angstrom below must match whatever that real
# value actually is. pytom_match_template.py falls back to the MRC
# header if voxel_size_angstrom isn't given explicitly -- pytom_step.py
# always passes it explicitly from this config instead. You'll see
# "WARNING: Provided voxel size does not match voxel size annotated in
# tomogram/template mrc." on every run because of this -- that's
# expected, and confirms the explicit value is being used instead of the
# header value.
#
# reference_map_voxel_size_angstrom is the reference density's OWN
# native pixel size (NOT the tomogram's) -- passed to
# pytom_create_template.py as --input-voxel-size-angstrom so it
# downsamples correctly to voxel_size_angstrom (the tomogram's real
# spacing) for --output-voxel-size-angstrom. Don't collapse these two
# into one value -- confirmed by a real bad-template-matching run where
# they'd been set equal by mistake (leftover from an earlier dataset),
# producing a ~30x scale mismatch that made matching produce garbage.
#
# create_template.invert flips the template's density sign -- needed
# when the reconstruction's contrast convention has the particle
# opposite from the reference map (check visually; there's no reliable
# way to infer this from metadata alone).
#
# create_mask's box size and mask radius (in pixels) are computed
# automatically from create_template's actual output box size and
# particle_diameter_angstrom / voxel_size_angstrom -- not set directly.
#
# GOTCHA (confirmed 2026-10-22 against RELION5 5.0.1's own source,
# src/jaz/tomography/particle_set.cpp): pytom's rlnTomoName comes from
# the tomogram file's own stem (e.g. IsoNet2 predict output
# "_isonet2_unet-medium_<base>_final"), which will NOT match the clean
# tilt series name in relion5_star's tomograms.star ("<base>"). RELION5
# auto-builds its particles.star optics table by EXACT rlnTomoName match
# against tomograms.star when particles.star has no optics block of its
# own -- a mismatch here fails that silently and surfaces later as
# "rlnTomoTiltSeriesPixelSize missing from optics MetaDataTable" with no
# mention of the real cause. relion5_tomograms_star points pytom_step.py
# at the real tomograms.star so it can remap rlnTomoName to the clean
# name (longest substring match) before merging.
# ---------------------------------------------------------------------------
# pytom:
#   bin_dir: /home/coari/.conda/envs/pytom_tm/bin
#   relion5_tomograms_star: /path/to/Relion_files/tomograms.star   # see GOTCHA above -- omit to skip the rlnTomoName remap
#   reference_map: /path/to/reference.mrc
#   reference_map_voxel_size_angstrom: 0.305   # the reference map's OWN native pixel size -- see GOTCHA above
#   particle_diameter_angstrom: 150     # in Angstrom, along the longest axis for non-globular particles
#   voxel_size_angstrom: 6.04           # must match isonet.predict's REAL output pixel size -- see GOTCHA above
#   # tomogram_dir:                     # defaults to isonet.predict.output_dir above (organize's tomograms with skip_denoise)
#   out_dir: /path/to/template_matching
#   gpu: [0, 1, 2, 3]
#   # center: true                     # center the reference's density by center of mass (default true)
#
#   create_template:
#     invert: true                     # flip density sign -- see GOTCHA above; check visually whether your dataset needs this
#
#   create_mask:
#     sigma: 1.0                       # gaussian drop-off at mask edges, in pixels
#
# GOTCHA (investigated and REJECTED 2026-10-24, imod_raptor + gold
# fiducial data): if picks look like they're landing on leftover gold
# after imod.erase_gold, don't assume it without checking -- a
# findbeads3d-based exclusion mask was built and tested here, but a
# proper random-baseline statistical check (real pick positions vs.
# uniform-random points, both measured against candidate gold sites)
# showed real picks land near gold candidates NO more often than chance
# (z-scores ~0-2 across several radii). The earlier "X% of picks near
# gold" read, done without that baseline, was a base-rate artifact of
# how much area that many candidate disks simply cover. Gold erasure
# itself WAS confirmed measurably incomplete at real bead sites (root
# cause: beads project as ellipses at high tilt angles -- e.g. 2x
# elongation at +/-60 deg -- so a fixed circular erasure radius can't
# fully cover them), but since it didn't bias picks, it was left as a
# cosmetic limitation. Before building a gold exclusion mask for a new
# dataset, run that random-baseline check first -- don't eyeball it.
#
#   match_template:
#     tilt_angles: [-60, 60]           # or a .tlt/.rawtlt file path instead of [min, max]
#     # low_pass: 20                   # resolution in A, if the template was pre-filtered to one
#     # random-phase-correction: true  # STOPGAP-style noise subtraction -- roughly doubles compute time
#
#   extract_candidates:
#     number_of_particles: 500
#     # cut_off: 0.5                  # override automatic cutoff estimation
#     # "relion5-compat": true        # write centered coordinates in Angstrom for RELION5 (real pytom flag, verified)
#   # merged_star_name: particles.star
#
#   # tm_figure stage: one PNG with every tomogram's central XY slice and
#   # its picks overlaid (solid = within z_slab_px of that slice, faint =
#   # elsewhere in Z), written to out_dir/out_name
#   figure:
#     out_name: picks_overview.png
#     z_slab_px: 20
